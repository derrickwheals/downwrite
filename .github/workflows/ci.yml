name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app-macos:
    name: App build + tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version | head -1
          swift --version 2>&1 | head -1
      - name: Build
        run: |
          set -o pipefail
          if ! swift build 2>&1 | tee build.log | tail -5; then
            echo "=== BUILD ERRORS ==="
            grep -E "error:" build.log | sort -u | head -60
            exit 1
          fi

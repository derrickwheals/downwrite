name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app-macos:
    name: App build, tests and e2e (macOS)
    runs-on: macos-26
    timeout-minutes: 40
    env:
      SNAPSHOT_DIR: ${{ github.workspace }}/artifacts/snapshots
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version | head -1
          swift --version 2>&1 | head -1
          mkdir -p artifacts/snapshots artifacts/e2e

      - name: Build
        run: |
          set -o pipefail
          if ! swift build 2>&1 | tee build.log | tail -3; then
            echo "=== BUILD ERRORS ==="; grep -E "error:" build.log | sort -u | head -60; exit 1
          fi

      - name: Unit and integration tests
        run: |
          swift test > test.log 2>&1
          STATUS=$?
          grep -E "Executed [0-9]+ tests" test.log | tail -1
          if [ $STATUS -ne 0 ]; then
            echo "=== TEST FAILURES ==="
            grep -E "error:|Fatal|Segmentation|Crash" test.log | sort -u | head -80
            exit 1
          fi

      - name: Package app bundle
        run: |
          scripts/build-app.sh > artifacts/package.log 2>&1 || { tail -30 artifacts/package.log; exit 1; }
          tail -12 artifacts/package.log
          for f in LICENSE THIRD-PARTY-NOTICES.md swift-markdown-LICENSE.txt cmark-gfm-COPYING.txt mermaid-LICENSE.txt; do
            if [ ! -s "dist/Downwrite.app/Contents/Resources/Legal/$f" ]; then echo "MISSING legal file: $f"; exit 1; fi
          done
          echo "legal files bundled: $(ls dist/Downwrite.app/Contents/Resources/Legal | tr '\n' ' ')" | tee -a artifacts/package.log
          ls dist/Downwrite.app/Contents/Resources | head -20 | tee -a artifacts/package.log
          du -sh dist/Downwrite.app | tee -a artifacts/package.log
          echo "--- compiled icon variants ---" | tee -a artifacts/package.log
          xcrun assetutil --info dist/Downwrite.app/Contents/Resources/Assets.car 2>/dev/null \
            | grep -E '"(Appearance|Name|AssetType|Idiom)"' | sort | uniq -c | head -30 | tee -a artifacts/package.log

      - name: End-to-end self-test (real app, real window)
        id: e2e
        continue-on-error: true
        run: |
          set +e
          dist/Downwrite.app/Contents/MacOS/Downwrite --selftest-out="$PWD/artifacts/e2e" --selftest-input="$PWD/Sources/Downwrite/Resources/Welcome.md" --selftest-extra="$PWD/README.md" > artifacts/e2e/stdout.txt 2>&1 &
          APP=$!
          for i in $(seq 1 150); do kill -0 $APP 2>/dev/null || break; sleep 1; done
          kill $APP 2>/dev/null
          wait $APP; echo "exit=$?"
          cat artifacts/e2e/selftest-report.txt 2>/dev/null || { echo "no report; app output:"; tail -40 artifacts/e2e/stdout.txt; }
          echo "--- menus ---"; cat artifacts/e2e/menus.txt 2>/dev/null | head -80
          grep -q "ALL CHECKS PASSED" artifacts/e2e/selftest-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downwrite-ci
          path: |
            artifacts/
            dist/Downwrite.app
          retention-days: 7

      # Commit screenshots to this same branch (normal push, never force) when the commit message contains [shots].
      - name: Record screenshots on the branch
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]')
        run: |
          mkdir -p docs/screenshots docs/ci
          cp artifacts/e2e/selftest-report.txt artifacts/e2e/menus.txt artifacts/package.log docs/ci/ 2>/dev/null || true
          grep -E "Executed [0-9]+ tests" test.log | tail -1 > docs/ci/test-summary.txt || true
          grep -E "error:" test.log | sort -u | head -40 >> docs/ci/test-summary.txt || true
          cp artifacts/e2e/window-*.png docs/screenshots/ 2>/dev/null || true
          cp artifacts/snapshots/*.png docs/screenshots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots docs/ci
          if git diff --cached --quiet; then echo "no screenshot changes"; else
            git commit -q -m "ci: update screenshots [skip ci]"
            for i in 1 2 3; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi

      - name: Fail if e2e failed
        if: steps.e2e.outcome == 'failure'
        run: echo "e2e self-test failed"; exit 1

      - name: Summary
        if: always()
        run: |
          echo "################ SUMMARY ################"
          echo "--- build errors ---"; grep -E "error:" build.log 2>/dev/null | sort -u | head -25
          echo "--- test result ---"; grep -E "Executed [0-9]+ tests" test.log 2>/dev/null | tail -1
          echo "--- test failures ---"; grep -E "error:|Fatal|Crash" test.log 2>/dev/null | sort -u | head -40
          echo "--- e2e report ---"; cat artifacts/e2e/selftest-report.txt 2>/dev/null | head -60
          echo "--- e2e app output (tail) ---"; tail -15 artifacts/e2e/stdout.txt 2>/dev/null || true
          true

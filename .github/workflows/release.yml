name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-26
    env:
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      DEVELOPER_ID_NAME: ${{ secrets.DEVELOPER_ID_NAME }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        timeout-minutes: 10   # a test stuck in an event-tracking loop must not hold the job for 40 minutes
        run: |
          # Capture the exit status explicitly: the default `bash -e` would abort before the failures are printed.
          STATUS=0
          swift test > test.log 2>&1 || STATUS=$?
          grep -E "Executed [0-9]+ tests" test.log | tail -1
          if [ $STATUS -ne 0 ]; then
            echo "=== TEST FAILURES ==="
            grep -E "error:|Fatal|Segmentation|Crash" test.log | sort -u | head -80
            exit 1
          fi

      - name: Import signing certificate (if provided)
        if: env.DEVELOPER_ID_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build app
        run: |
          if [ -n "$DEVELOPER_ID_NAME" ]; then export SIGN_IDENTITY="$DEVELOPER_ID_NAME"; fi
          VERSION="${{ steps.v.outputs.version }}" BUILD="${{ github.run_number }}" scripts/build-app.sh

      - name: Package DMG
        run: VERSION="${{ steps.v.outputs.version }}" scripts/make-dmg.sh

      - name: Notarize and staple (if credentials provided)
        if: env.NOTARY_APPLE_ID != ''
        run: |
          DMG="dist/Downwrite-${{ steps.v.outputs.version }}.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: Downwrite-${{ steps.v.outputs.version }}
          path: dist/Downwrite-${{ steps.v.outputs.version }}.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/Downwrite-${{ steps.v.outputs.version }}.dmg" \
            --title "Downwrite ${{ steps.v.outputs.version }}" --generate-notes
